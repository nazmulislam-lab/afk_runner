[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandcastle-py"
version = "0.14.0"
description = "Orchestrate AI coding agents in isolated sandboxes (Python port of mattpocock/sandcastle) with automatic resume after usage-limit resets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
e2b = ["e2b>=2.0"]
daytona = ["daytona>=0.100"]
modal = ["modal>=1.0"]
sprites = ["sprites-py>=0.7"]
vercel = ["vercel-sandbox>=1.0"]
planner = ["pydantic>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pydantic>=2"]

[project.scripts]
sandcastle = "sandcastle.cli:main"
afk-runner = "sandcastle.cli:main"

[tool.setuptools.packages.find]
include = ["sandcastle*"]

[tool.setuptools.package-data]
sandcastle = ["templates/*/*.md", "templates/*/*.py", "templates/*/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
